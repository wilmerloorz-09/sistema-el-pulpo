name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - ".github/workflows/android-apk.yml"

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0
          accept-android-sdk-licenses: true

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build web app
        run: npm run build

      - name: Verify web build output
        run: |
          test -f dist/index.html
          ls -la dist/

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Verify Capacitor Share plugin in native project
        run: grep -q "capacitor-share" android/capacitor.settings.gradle

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace --no-daemon -x lint

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sistema-el-pulpo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
